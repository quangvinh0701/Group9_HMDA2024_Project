# =============================================================================
# expected.yaml - Số kiểm tra cho project HMDA 2024, Nhóm 9
#
# Đi kèm rules.yaml 1.1. File này cập nhật bất cứ lúc nào có số mới, không cần
# đổi phiên bản rules. Mỗi số ghi: giá trị, phạm vi, nguồn, trạng thái.
#
# Trạng thái:
#   verified : ít nhất hai nguồn độc lập ra cùng số
#   single   : mới có một nguồn; pipeline còn lại cần xác nhận
#   pending  : chưa có số theo rules hiện hành (số cũ, nếu có, ghi ở old_value)
#
# Nguồn: profile = profile_hmda.py (Vinh); kaggle = notebook thử môi trường
# (Pandas + Spark); son = pipeline Spark; cong = pipeline Pandas (bản cũ);
# v1_pandas, v1_spark = notebook HMDA v1 chạy trên Kaggle ngày 2026-11-07.
# =============================================================================

